<!doctype html>
<html lang="ru" class="dark">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Cdefs%3E%3ClinearGradient id='g' x1='0' y1='0' x2='1' y2='1'%3E%3Cstop offset='0' stop-color='%233B82F6'/%3E%3Cstop offset='1' stop-color='%23A855F7'/%3E%3C/linearGradient%3E%3C/defs%3E%3Crect x='1.4' y='1.4' width='29.2' height='29.2' rx='8' fill='%23fff' stroke='url(%23g)' stroke-width='2'/%3E%3Cpath d='M7 10 L11 22 L16 14 L21 22 L25 10' fill='none' stroke='url(%23g)' stroke-width='2.8' stroke-linejoin='round' stroke-linecap='round'/%3E%3C/svg%3E" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, interactive-widget=resizes-content" />
    <script>
      // iOS: Safari приближает страницу при фокусе на любом поле с шрифтом
      // мельче 16px (в альбомной ориентации, contenteditable, date-поля —
      // CSS-правило из index.css туда не дотягивается), и обратно сам не
      // отдаляет: «интерфейс сам увеличивается». maximum-scale=1 iOS (с 10-й
      // версии) применяет ТОЛЬКО к авто-зуму, ручной щипок остаётся. Android
      // по maximum-scale запретил бы щипок, а авто-зума у него нет — ему не ставим.
      (function () {
        var ua = navigator.userAgent;
        var ios = /iPhone|iPad|iPod/.test(ua) || (/Macintosh/.test(ua) && navigator.maxTouchPoints > 1);
        if (!ios) return;
        var m = document.querySelector('meta[name="viewport"]');
        if (m) m.setAttribute('content', m.getAttribute('content') + ', maximum-scale=1');
      })();
    </script>
    <script>
      // Белый экран после выкатки: телефон взял из кэша index.html прошлой
      // сборки, а её скрипт/стили на сервере уже 404 — приложение не стартует.
      // Ловим провал загрузки своих ассетов и перезагружаемся мимо кэша
      // (уникальный ?v=…) — не больше двух раз за минуту; дальше заставка
      // покажет «Обновить». Счётчик сбрасывает main.tsx после старта.
      (function () {
        var KEY = 'era-boot-retry';
        function bustReload() {
          try {
            var s = JSON.parse(sessionStorage.getItem(KEY) || '{"n":0,"t":0}');
            if (Date.now() - s.t > 60000) s = { n: 0, t: Date.now() };
            if (s.n >= 2) return;
            s.n++;
            sessionStorage.setItem(KEY, JSON.stringify(s));
          } catch (e) { /* приватный режим — без счётчика, но с одним повтором */ }
          var u = new URL(location.href);
          u.searchParams.set('v', Date.now().toString(36));
          location.replace(u.toString());
        }
        window.__eraBustReload = bustReload;
        window.addEventListener('error', function (e) {
          var t = e.target;
          if (!t || (t.tagName !== 'SCRIPT' && t.tagName !== 'LINK')) return;
          var url = t.src || t.href || '';
          if (/\/assets\/[^/?#]+\.(js|css)(\?|#|$)/.test(url)) bustReload();
        }, true);
      })();
    </script>
    <!-- Мобильное веб-приложение: «На экран Домой» открывает CRM на весь
         экран, без адресной строки Safari и без его «потяни — обновить». -->
    <link rel="manifest" href="/crm/manifest.webmanifest" />
    <link rel="apple-touch-icon" href="/crm/icons/apple-touch-icon.png" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Weglow CRM" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="theme-color" content="#FFFFFF" />
    <!-- iOS превращает номера телефонов в тексте в tel:-ссылки: тап по карточке
         сделки с номером открывал звонок вместо карточки. Звоним своими кнопками. -->
    <meta name="format-detection" content="telephone=no, date=no, address=no, email=no" />

    <!-- Базовый CSP: ограничивает источники скриптов и подключений. На GitHub
         Pages нет HTTP-заголовков, поэтому используем meta — это слабее
         (clickjacking через X-Frame-Options не покрывается, нужен фронтинг
         через Cloudflare/Caddy для полной защиты), но JS-инъекции и
         exfiltration через произвольные домены отсекает.
         Поправь, если добавляешь новый внешний сервис (Stripe, Yandex Metrica и т.п.). -->
    <meta http-equiv="Content-Security-Policy" content="
      default-src 'self';
      script-src 'self' 'unsafe-inline' 'wasm-unsafe-eval' https://stats.sipuni.com;
      style-src 'self' 'unsafe-inline' https://fonts.googleapis.com;
      font-src 'self' data: https://fonts.gstatic.com;
      img-src 'self' data: blob: https:;
      media-src 'self' blob: https:;
      worker-src 'self' blob:;
      connect-src 'self' blob: https://*.supabase.co wss://*.supabase.co https://api.wazzup24.com https://api.kaspi.kz https://kaspi.kz https://stats.sipuni.com wss://voip.sipuni.com:* https://voip.sipuni.com:* wss://pbx.officeweglow.kz https://prod.spline.design https://*.spline.design;
      frame-src https://app.wazzup24.com https://*.wazzup24.com;
      frame-ancestors 'none';
      base-uri 'self';
      form-action 'self';
    " />
    <!-- Запрет встраивания в iframe (clickjacking) — meta-аналог X-Frame-Options.
         frame-ancestors в CSP выше уже это делает, но дублируем referrer-policy. -->
    <meta name="referrer" content="strict-origin-when-cross-origin" />
    <title>Weglow CRM</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />
    <script type="module" crossorigin src="/crm/assets/index-Cvzmq5KF.js"></script>
    <link rel="modulepreload" crossorigin href="/crm/assets/icons-ChIDfvi9.js">
    <link rel="modulepreload" crossorigin href="/crm/assets/motion-CePPw_Mb.js">
    <link rel="modulepreload" crossorigin href="/crm/assets/dnd-C8dUqEMQ.js">
    <link rel="modulepreload" crossorigin href="/crm/assets/three-Cm6remgg.js">
    <link rel="modulepreload" crossorigin href="/crm/assets/r3f-Du-NB3Fu.js">
    <link rel="modulepreload" crossorigin href="/crm/assets/spline-B1fjMNs2.js">
    <link rel="modulepreload" crossorigin href="/crm/assets/supabase-D3Pb_Qvf.js">
    <link rel="stylesheet" crossorigin href="/crm/assets/index-D0I_s0ym.css">
  </head>
  <body class="antialiased">
    <!-- Заставка до старта React (main.tsx её убирает). Раньше до загрузки
         скрипта был пустой белый экран; если CRM не стартовала за 15 с —
         показываем причину и кнопку «Обновить» (мимо кэша). -->
    <div id="root"><div id="boot" style="position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;padding:24px;text-align:center;font:15px/1.4 -apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;background:#F2F2F7;color:#6B7785"><div id="boot-msg">Загрузка CRM…</div><button id="boot-reload" type="button" style="display:none;height:44px;padding:0 22px;border:0;border-radius:12px;background:#2563EB;color:#fff;font:600 15px -apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif">Обновить</button></div></div>
    <script>
      (function () {
        try {
          var ui = JSON.parse(localStorage.getItem('era-crm-ui') || '{}');
          var theme = ui && ui.state && ui.state.theme;
          var boot = document.getElementById('boot');
          if (boot && theme === 'dark') { boot.style.background = '#0F172A'; boot.style.color = '#94A3B8'; }
          if (boot && theme === 'tron') { boot.style.background = '#02040A'; boot.style.color = '#7BB7CC'; }
        } catch (e) { /* без темы — светлая заставка */ }
        setTimeout(function () {
          if (!document.getElementById('boot')) return;
          document.getElementById('boot-msg').textContent = 'CRM не загрузилась. Проверьте интернет и нажмите «Обновить».';
          var b = document.getElementById('boot-reload');
          b.style.display = 'block';
          b.addEventListener('click', function () {
            try { sessionStorage.removeItem('era-boot-retry'); } catch (e) {}
            if (window.__eraBustReload) window.__eraBustReload();
            else location.reload();
          });
        }, 15000);
      })();
    </script>
  </body>
</html>
